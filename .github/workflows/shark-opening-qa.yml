name: Check portfolio shark opening
on:
  push:
    branches: ['qa/shark-opening-292fe30']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the baseline and Chromium
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" 292fe300c9f9eed9aeac7215a1423771cc2e4aa2
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Render the portfolio and verify opening frames
        run: node qa-opening-visual.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: portfolio-before-and-after
          path: qa-screenshots/
          retention-days: 1
