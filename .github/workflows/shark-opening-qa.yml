name: Glass bar preview QA
on:
  push:
    branches: [qa/shark-opening-292fe30]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use the runner's installed Chrome
        run: |
          google-chrome --version
          npm install --registry=https://registry.npmjs.org --fetch-retries=1 --fetch-timeout=30000 --no-save --no-package-lock playwright@1.58.2
      - name: Compare current and preview glass
        env:
          QA_CHROME_CHANNEL: chrome
        run: |
          git worktree add --detach "$RUNNER_TEMP/baseline" d781abc728e4320124e55b5bf553394c3e730732
          node qa-glass-comparison.mjs
