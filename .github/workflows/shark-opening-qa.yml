name: Capture the portfolio glass reference
on:
  push:
    branches: ['qa/shark-opening-292fe30']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install browser tooling for preview checks
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Seek the public original clip to its midpoint
        run: node qa-glass-reference.mjs
