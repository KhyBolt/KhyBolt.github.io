<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Selected work by Khy Bolt: the Doppler acoustics replay and an independent Seattle pothole worklist demo.">
  <title>Khy Bolt — Portfolio</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/home.css">
  <link rel="stylesheet" href="./assets/reference.css?v=3c0a95a69a355b7d">
  <script src="./assets/reference-theme.js?v=d18b26892c06b6e3"></script>
  <link rel="stylesheet" href="./assets/public.css?v=projects1">
  <link rel="stylesheet" href="./assets/ask.css?v=glass5">
  <script type="module" src="./assets/ask.mjs?v=lean2"></script>
  <script type="module" src="./assets/views.mjs?v=projects1"></script>
  <script src="./assets/home.js?v=focal1" defer></script>
  <script src="./assets/site-ocean/reference-ocean.js?v=shark-entry-1" defer></script>
</head>
<body class="home reference public-portfolio">
  <a class="screen-reader skip-link" href="#projects" data-portfolio-link>Skip to projects</a>
  <nav class="portfolio-nav" aria-label="Portfolio views">
    <a href="#projects" data-portfolio-link>Projects <span aria-hidden="true">→</span></a>
    <a href="#ask" data-portfolio-link><span aria-hidden="true">←</span> Ask</a>
  </nav>
  <div class="field" aria-hidden="true">
    <canvas id="ocean-canvas"></canvas>
    <div class="field-fade"></div>
  </div>
  <main class="shell portfolio-shell">
    <div class="portfolio-views">
      <section class="portfolio-view" id="ask" aria-labelledby="ask-heading">
          <div class="portfolio-focal">
            <header class="masthead">
              <p class="portfolio-name">Khy Bolt</p>
              <h1 class="portfolio-headline" id="ask-heading" tabindex="-1">Ask anything about me</h1>
            </header>
            <section class="portfolio-ask" aria-label="Ask about Khy Bolt’s portfolio">
              <form id="portfolio-ask-form" data-endpoint="" hidden>
                <label class="screen-reader" for="portfolio-question">Ask about my projects</label>
                <input id="portfolio-question" name="question" type="text" maxlength="240" enterkeyhint="go"
                  autocomplete="off" placeholder="Ask about my projects…" required>
                <button type="submit" aria-label="Ask">
                  <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M3.25 8h9.5m-4-4 4 4-4 4"/>
                  </svg>
                </button>
              </form>
              <p class="screen-reader ask-status" id="portfolio-ask-status" role="status" aria-live="polite"></p>
              <div class="ask-answer" id="portfolio-answer" hidden>
                <p id="portfolio-answer-text"></p>
                <ul id="portfolio-answer-links" aria-label="Answer sources"></ul>
              </div>
            </section>
          </div>
      </section>
      <section class="portfolio-view portfolio-projects" id="projects" aria-labelledby="projects-heading">
        <header class="masthead">
          <p class="portfolio-name">Khy Bolt</p>
          <h2 class="portfolio-headline" id="projects-heading" tabindex="-1">Projects</h2>
        </header>
        <ul class="project-grid" aria-label="Projects">
          <li class="project-tile">
            <a class="tile-link" href="./doppler/" aria-label="Doppler, open synthetic aircraft acoustics demo">
              <span class="tile-frame"><img src="./assets/frames/doppler.webp" alt="" decoding="async"></span>
              <span class="tile-title"><span>Doppler</span><span class="tile-arrow" aria-hidden="true">↗</span></span>
            </a>
          </li>
          <li class="project-tile" data-tile>
            <a class="tile-link" href="./seattle/" aria-label="Seattle Pothole Worklist, open browser demo">
              <span class="tile-frame"><img src="./assets/frames/seattle-01.webp" data-frame="0" data-label="Orders due today" alt="" decoding="async">
            <img src="./assets/frames/seattle-02.webp" data-frame="1" data-label="Dispatcher review-capacity comparison" alt="" loading="lazy" decoding="async" hidden>
            <img src="./assets/frames/seattle-03.webp" data-frame="2" data-label="Repair closure history" alt="" loading="lazy" decoding="async" hidden></span>
              <span class="tile-title"><span>Seattle Pothole Worklist</span><span class="tile-arrow" aria-hidden="true">↗</span></span>
            </a>
            <button type="button" class="frame-step" aria-label="Next preview frame for Seattle Pothole Worklist" hidden><span aria-hidden="true">01 / 03</span></button>
          </li>
        </ul>
      </section>
    </div>
  </main>
  <div class="reference-actions">
    <button type="button" id="reference-theme" class="theme-switch" role="switch" aria-checked="false"
      aria-label="Light theme" title="Switch to light theme" hidden>
      <span class="theme-track" aria-hidden="true">
        <span class="theme-knob">
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" focusable="false">
            <path d="M19.5 15A8.3 8.3 0 0 1 9 4.5 8.3 8.3 0 1 0 19.5 15Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" focusable="false">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 2.5v2m0 15v2M2.5 12h2m15 0h2M5.3 5.3l1.4 1.4m10.6 10.6 1.4 1.4m0-13.4-1.4 1.4M6.7 17.3l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
      </span>
    </button>
  </div>
</body>
</html>
