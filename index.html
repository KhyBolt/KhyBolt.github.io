<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Selected work by Khy Bolt: the Doppler acoustics replay and an independent Seattle pothole worklist demo.">
  <title>Khy Bolt — Portfolio</title>
  <link rel="icon" href="./assets/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./assets/home.css">
  <link rel="stylesheet" href="./assets/reference.css?v=3c0a95a69a355b7d">
  <script src="./assets/reference-theme.js?v=d18b26892c06b6e3"></script>
  <link rel="stylesheet" href="./assets/public.css?v=projects4">
  <link rel="stylesheet" href="./assets/ask.css?v=glass7">
  <script type="module" src="./assets/ask.mjs?v=lean5"></script>
  <script type="module" src="./assets/views.mjs?v=projects1"></script>
  <script src="./assets/home.js?v=focal2" defer></script>
  <script src="./assets/site-ocean/reference-ocean.js?v=shark-species-1" defer></script>
</head>
<body class="home reference public-portfolio">
  <a class="screen-reader skip-link" href="#projects" data-portfolio-link>Skip to projects</a>
  <nav class="portfolio-nav" aria-label="Portfolio views">
    <a href="#projects" data-portfolio-link>Projects <span aria-hidden="true">→</span></a>
    <a href="#ask" data-portfolio-link><span aria-hidden="true">←</span> Ask</a>
  </nav>
  <div class="field" aria-hidden="true">
    <canvas id="ocean-canvas"></canvas>
    <div class="field-fade"></div>
  </div>
  <main class="shell portfolio-shell">
    <div class="portfolio-views">
      <section class="portfolio-view" id="ask" aria-labelledby="ask-heading">
          <div class="portfolio-focal">
            <header class="masthead">
              <p class="portfolio-name">Khy Bolt</p>
              <h1 class="portfolio-headline" id="ask-heading" tabindex="-1">Ask about me</h1>
            </header>
            <section class="portfolio-ask" aria-label="Ask about Khy Bolt">
              <form id="portfolio-ask-form" data-endpoint="" hidden>
                <label class="screen-reader" for="portfolio-question">Ask about my background, work or projects</label>
                <textarea id="portfolio-question" name="question" rows="1" enterkeyhint="send"
                  autocomplete="off" placeholder="Ask about my background, work or projects"
                  data-compact-placeholder="Background, work, projects" required></textarea>
                <button type="submit" aria-label="Ask">
                  <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
                    <path d="M3.25 8h9.5m-4-4 4 4-4 4"/>
                  </svg>
                </button>
              </form>
              <p class="screen-reader ask-status" id="portfolio-ask-status" role="status" aria-live="polite"></p>
              <div class="ask-answer" id="portfolio-answer" hidden>
                <p id="portfolio-answer-text"></p>
                <ul id="portfolio-answer-links" aria-label="Answer sources"></ul>
              </div>
            </section>
          </div>
      </section>
      <section class="portfolio-view portfolio-projects" id="projects" aria-labelledby="projects-heading">
        <header class="masthead">
          <p class="portfolio-name">Khy Bolt</p>
          <h2 class="portfolio-headline" id="projects-heading" tabindex="-1">Projects</h2>
        </header>
        <ul class="project-grid" aria-label="Projects">
          <li class="project-tile">
            <a class="tile-link" href="./doppler/" aria-label="Aircraft Audio Geolocation, open synthetic aircraft acoustics demo">
              <span class="tile-frame"><img src="./assets/frames/doppler.webp" alt="" decoding="async"></span>
              <span class="tile-title"><span>Aircraft Audio Geolocation</span><span class="tile-arrow" aria-hidden="true">↗</span></span>
            </a>
          </li>
          <li class="project-tile" data-tile>
            <a class="tile-link corner-pond-link" href="./assets/frames/corner-pond/01-corner-pond-home.png"
              aria-label="Corner Pond, coming soon. View game screenshots">
              <span class="tile-frame">
                <img src="./assets/frames/corner-pond/01-corner-pond-home.png" alt="" data-frame="0" data-label="An angler on a dock near an orange boat" decoding="async">
                <img src="./assets/frames/corner-pond/02-pebble-creek.png" alt="" data-frame="1" data-label="An eel and small fish beneath a mill wheel at Pebble Creek" decoding="async" loading="lazy" hidden>
                <img src="./assets/frames/corner-pond/03-first-discovery.png" alt="" data-frame="2" data-label="First discovery card for a 31.1 cm Silver Minnow" decoding="async" loading="lazy" hidden>
                <img src="./assets/frames/corner-pond/04-field-journal.png" alt="" data-frame="3" data-label="Silver Minnow field journal with a chart and catch history" decoding="async" loading="lazy" hidden>
                <img src="./assets/frames/corner-pond/05-lantern-depths.png" alt="" data-frame="4" data-label="A long-snouted fish among mushrooms and blue tendrils in Lantern Depths" decoding="async" loading="lazy" hidden>
                <img src="./assets/frames/corner-pond/06-tackle-shop.png" alt="" data-frame="5" data-label="Ashwood Rod and stat gauges in the tackle shop" decoding="async" loading="lazy" hidden>
              </span>
              <span class="tile-title">
                <span><span>Corner Pond</span><small class="corner-pond-description">Idle fishing game</small></span>
                <small>Coming soon</small>
              </span>
            </a>
          </li>
        </ul>
      </section>
    </div>
  </main>
  <div class="reference-actions">
    <button type="button" id="reference-theme" class="theme-switch" role="switch" aria-checked="false"
      aria-label="Light theme" title="Switch to light theme" hidden>
      <span class="theme-track" aria-hidden="true">
        <span class="theme-knob">
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" focusable="false">
            <path d="M19.5 15A8.3 8.3 0 0 1 9 4.5 8.3 8.3 0 1 0 19.5 15Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" focusable="false">
            <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.7"/>
            <path d="M12 2.5v2m0 15v2M2.5 12h2m15 0h2M5.3 5.3l1.4 1.4m10.6 10.6 1.4 1.4m0-13.4-1.4 1.4M6.7 17.3l-1.4 1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </span>
      </span>
    </button>
  </div>
  <dialog class="corner-pond-gallery" aria-labelledby="corner-pond-heading">
    <header>
      <h2 id="corner-pond-heading">Corner Pond</h2>
      <form method="dialog"><button autofocus>Close</button></form>
    </header>
    <div class="corner-pond-photos">
        <img src="./assets/frames/corner-pond/01-corner-pond-home.png" alt="An angler on a dock near an orange boat" width="1600" height="900" decoding="async" loading="lazy">
        <img src="./assets/frames/corner-pond/02-pebble-creek.png" alt="An eel and small fish beneath a mill wheel at Pebble Creek" width="1600" height="900" decoding="async" loading="lazy">
        <img src="./assets/frames/corner-pond/03-first-discovery.png" alt="First discovery card for a 31.1 cm Silver Minnow" width="520" height="340" decoding="async" loading="lazy">
        <img src="./assets/frames/corner-pond/04-field-journal.png" alt="Silver Minnow field journal with a chart and catch history" width="960" height="640" decoding="async" loading="lazy">
        <img src="./assets/frames/corner-pond/05-lantern-depths.png" alt="A long-snouted fish among mushrooms and blue tendrils in Lantern Depths" width="1219" height="800" decoding="async" loading="lazy">
        <img src="./assets/frames/corner-pond/06-tackle-shop.png" alt="Ashwood Rod and stat gauges in the tackle shop" width="960" height="640" decoding="async" loading="lazy">
    </div>
  </dialog>
  <script type="module" src="./assets/corner-pond.mjs?v=2"></script>
</body>
</html>
